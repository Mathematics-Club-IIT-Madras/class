# Based on https://github.com/r-lib/actions/blob/v2/examples/check-standard.yaml
name: R package checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, r: release, openmp: true}
          - {os: macos-latest, r: release, openmp: true}
          - {os: ubuntu-latest, r: release, openmp: true}
          - {os: ubuntu-latest, r: devel, openmp: true}
          - {os: ubuntu-latest, r: release, openmp: false}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_LIMIT_CORES_: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          http-user-agent: release
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Disable OpenMP for portability check
        if: ${{ !matrix.openmp }}
        shell: Rscript {0}
        run: |
          path <- file.path(Sys.getenv("RUNNER_TEMP"), "Makevars-no-openmp")
          writeLines("SHLIB_OPENMP_CXXFLAGS =", path)
          cat(paste0("R_MAKEVARS_USER=", path, "\n"), file = Sys.getenv("GITHUB_ENV"), append = TRUE)
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran", "--no-manual")'
          build_args: 'c("--no-manual")'
          error-on: '"warning"'
